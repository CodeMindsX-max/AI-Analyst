[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "analystai-backend"
version = "1.0.0"
description = "AnalystAI FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "app/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
